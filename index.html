<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üç Yönlü Savaş - İyi & Kötü Olaylar</title>
<style>
  body {
    margin: 0;
    background: #0a0a1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
  canvas {
    background: #111;
    border: 2px solid #00e5ff;
    border-radius: 8px;
    box-shadow: 0 0 20px #00e5ff55;
  }
  .info { margin-top: 10px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
  <h1>⚔️ Üç Yönlü Savaş - İyi & Kötü Olaylar ⚔️</h1>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="info">WASD / Ok tuşları: Hareket &nbsp;|&nbsp; SPACE: Ateş &nbsp;|&nbsp; R: Yeniden Başla</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let highScore = 0;
try {
  const saved = localStorage.getItem('highScore');
  if (saved !== null) highScore = parseInt(saved) || 0;
} catch (e) {}
let newRecord = false;

const player = {
  x: W/2, y: H - 80,
  size: 22, baseSize: 22,
  speed: 4, baseSpeed: 4,
  hp: 5, maxHp: 5,
  cooldown: 0, invuln: 0
};

let bullets = [], enemies = [], particles = [], bossBullets = [];
let score = 0, gameOver = false, spawnTimer = 0, difficulty = 1;

let boss = null, nextBossAt = 1000, bossLevel = 1;
let bossWarning = 0, screenShake = 0;

const GOOD_EVENTS = [
  { id: 'doubleShot',   name: '🔫 ÇİFT MERMİ',    duration: 600, color: '#ffaa00', desc: 'Aynı anda 2 mermi!', type: 'good' },
  { id: 'rapidFire',    name: '⚡ HIZLI ATEŞ',    duration: 480, color: '#00ff88', desc: 'Çok hızlı ateş!', type: 'good' },
  { id: 'shield',       name: '🛡️ KALKAN',         duration: 1,   color: '#00e5ff', desc: 'Bir vuruşu absorbe eder', type: 'good' },
  { id: 'heal',         name: '❤️ CAN +1',         duration: 1,   color: '#ff3860', desc: 'Canın yenilendi!', type: 'good' },
  { id: 'slowmo',       name: '🐌 YAVAŞ ZAMAN',   duration: 420, color: '#b388ff', desc: 'Düşmanlar yavaşladı!', type: 'good' },
  { id: 'bomb',         name: '💣 BOMBA',          duration: 1,   color: '#ff6600', desc: 'Tüm düşmanlar yok!', type: 'good' },
  { id: 'doubleScore',  name: '✨ 2x SKOR',        duration: 600, color: '#ffff00', desc: 'Çift skor kazanırsın!', type: 'good' },
  { id: 'ghost',        name: '👻 HAYALET MOD',    duration: 360, color: '#ffffff', desc: 'Hasar almazsın!', type: 'good' }
];

const BAD_EVENTS = [
  { id: 'reverseControls', name: '🌀 TERS KONTROL',   duration: 480, color: '#ff0000', desc: 'Kontroller ters döndü!', type: 'bad' },
  { id: 'fog',             name: '🌫️ SİS',            duration: 600, color: '#666666', desc: 'Görüş alanın azaldı!', type: 'bad' },
  { id: 'playerSlow',      name: '🐌 YAVAŞLAMA',      duration: 420, color: '#990000', desc: 'Hareketin yavaşladı!', type: 'bad' },
  { id: 'damage',          name: '💔 CAN -1',          duration: 1,   color: '#cc0000', desc: '1 can kaybettin!', type: 'bad' },
  { id: 'shrink',          name: '🎯 KÜÇÜLME',        duration: 600, color: '#ff3366', desc: 'Boyutun küçüldü!', type: 'bad' },
  { id: 'enemyRain',       name: '🌪️ DÜŞMAN YAĞMURU', duration: 1,   color: '#ff6600', desc: 'Çok sayıda düşman!', type: 'bad' },
  { id: 'slowShoot',       name: '🔇 YAVAŞ ATEŞ',     duration: 480, color: '#996600', desc: 'Ateş hızın düştü!', type: 'bad' },
  { id: 'invisible',       name: '👁️ GÖRÜNMEZLİK',    duration: 480, color: '#333333', desc: 'Düşmanlar görünmez!', type: 'bad' }
];

let activeEvents = [], shieldActive = false;
let nextEventAt = 500, eventAnnounce = null, eventAnnounceTimer = 0;
let controlsReversed = false;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (gameOver && e.key.toLowerCase() === 'r') resetGame();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 30, color
    });
  }
}

function applyEvent(evt) {
  eventAnnounce = evt;
  eventAnnounceTimer = 150;
  if (evt.type === 'bad') screenShake = 20;
  
  switch (evt.id) {
    case 'doubleShot': case 'rapidFire': case 'slowmo':
    case 'doubleScore': case 'ghost': case 'reverseControls':
    case 'fog': case 'playerSlow': case 'shrink':
    case 'slowShoot': case 'invisible':
      activeEvents.push({
        id: evt.id, name: evt.name, color: evt.color,
        remaining: evt.duration, type: evt.type
      });
      if (evt.id === 'reverseControls') controlsReversed = true;
      if (evt.id === 'playerSlow') player.speed = player.baseSpeed * 0.5;
      if (evt.id === 'shrink') player.size = player.baseSize * 0.6;
      if (evt.id === 'slowShoot') player.cooldown = 30;
      break;
    case 'shield':
      shieldActive = true;
      spawnParticles(player.x, player.y, '#00e5ff', 30);
      break;
    case 'heal':
      if (player.hp < player.maxHp) {
        player.hp++;
        spawnParticles(player.x, player.y, '#ff3860', 25);
      } else {
        score += 100;
        spawnParticles(player.x, player.y, '#ffff00', 25);
      }
      break;
    case 'bomb':
      for (const e of enemies) {
        spawnParticles(e.x, e.y, e.color, 15);
        score += hasEvent('doubleScore') ? 20 : 10;
      }
      enemies = [];
      screenShake = 40;
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: W/2 + (Math.random() - 0.5) * W,
          y: H/2 + (Math.random() - 0.5) * H,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          life: 40,
          color: ['#ff6600', '#ffff00', '#ff3860'][Math.floor(Math.random() * 3)]
        });
      }
      break;
    case 'damage':
      if (player.invuln <= 0) {
        if (!hasEvent('ghost') && !shieldActive) {
          player.hp--;
          player.invuln = 60;
          spawnParticles(player.x, player.y, '#ff0000', 30);
          screenShake = 25;
          if (player.hp <= 0) {
            gameOver = true;
            if (score > highScore) {
              highScore = score; newRecord = true;
              try { localStorage.setItem('highScore', highScore); } catch (e) {}
            }
          }
        } else if (shieldActive) {
          shieldActive = false;
          spawnParticles(player.x, player.y, '#00e5ff', 25);
        }
      }
      break;
    case 'enemyRain':
      for (let i = 0; i < 8; i++) setTimeout(() => spawnEnemy(), i * 100);
      screenShake = 15;
      break;
  }
}

function hasEvent(id) { return activeEvents.some(e => e.id === id); }

function triggerRandomEvent() {
  const isGood = Math.random() < 0.6;
  const pool = isGood ? GOOD_EVENTS : BAD_EVENTS;
  applyEvent(pool[Math.floor(Math.random() * pool.length)]);
}

function spawnEnemy() {
  if (boss) return;
  const side = Math.floor(Math.random() * 3);
  let e;
  if (side === 0) {
    e = { x: Math.random() * (W - 40) + 20, y: -30,
      size: 20 + Math.random() * 10, speed: 1.2 + Math.random() * 0.8,
      hp: 2, color: '#ff3860', dir: 'down' };
  } else if (side === 1) {
    e = { x: -30, y: Math.random() * (H - 200) + 50,
      size: 18, speed: 1.8 + Math.random() * 1,
      hp: 1, color: '#ffaa00', dir: 'right' };
  } else {
    e = { x: W + 30, y: Math.random() * (H - 200) + 50,
      size: 18, speed: 1.8 + Math.random() * 1,
      hp: 1, color: '#b388ff', dir: 'left' };
  }
  let speedMult = hasEvent('slowmo') ? 0.4 : 1;
  e.speed *= Math.min(1 + difficulty * 0.05,
